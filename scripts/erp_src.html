<!DOCTYPE html>
<html lang="ko">

<meta name="description" content="이카운트 자료로 보는 매출 검색·월별 매출·창고별 재고·재고 관리·원가 관리">
<meta property="og:type" content="website">
<meta property="og:title" content="디앤디컴 ERP · 매출·재고·원가">
<meta property="og:description" content="이카운트 자료로 보는 매출 검색·월별 매출·창고별 재고·재고 관리·원가 관리">
<meta property="og:image" content="https://dnd-coupang.pages.dev/og.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/
/* ERP 전용 */
:root{--bar:#233a5e}
header a.hl{color:#fff;text-decoration:none;font-size:13px;border:1px solid rgba(255,255,255,.45);padding:5px 10px;border-radius:3px;white-space:nowrap}
header a.hl:hover{background:rgba(255,255,255,.12)}
header button.hl{background:none;color:#fff;font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.45);padding:5px 10px;border-radius:3px;cursor:pointer;white-space:nowrap}
header button.hl.on{background:#f2c94c;color:#1b2330;border-color:#f2c94c;font-weight:600}
.f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;padding:12px}
.f label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.f label.ck{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:14px;min-height:38px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:0 12px;min-height:36px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--bar);color:#fff}
.tw{overflow:auto;max-height:70vh}
.tw td:first-child,.tw th:first-child{position:sticky;left:0;z-index:2;background:var(--panel)}
.tw th:first-child{z-index:3;background:var(--head)}.tw tr.gt td:first-child{background:var(--head)}
.tw thead th{top:0}
.tw tr.gt td{position:sticky;bottom:0;z-index:1}.tw tr.gt td:first-child{z-index:3}
td.t{max-width:340px;overflow:hidden;text-overflow:ellipsis}
.more{padding:8px 12px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
.st-품절,.st-부족{background:var(--red);color:#fff}.st-과다{border-color:#e0902b;color:#b86e12}.st-무판매{border-color:var(--gray);color:var(--mute)}.st-적정{border-color:var(--blue);color:var(--blue)}
.alerts{display:grid;gap:8px;margin:0 0 14px}
.alerts .msg{margin:0}
.lock{max-width:560px}
.days{display:flex;gap:2px;align-items:flex-end}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px;margin:2px 4px 2px 0;color:var(--mute)}
#log li{margin:3px 0}
td.in input{min-width:70px}
tr.ret td{color:var(--red)}
.wh{font-size:12px;color:var(--mute)}
.msg.err{border-left-color:var(--red);background:light-dark(#fff5f5,#2a1616)}
</style>
</head>
<body>
<header>
  <h1>디앤디컴 ERP</h1>
  <nav role="tablist" id="nav">
    <button data-t="dash" aria-selected="true">대시보드</button>
    <button data-t="sale">매출 검색</button>
    <button data-t="mon">월별 매출</button>
    <button data-t="stock">재고 현황</button>
    <button data-t="inv">재고 관리</button>
    <button data-t="cost">원가 관리</button>
    <button data-t="up">업로드</button>
  </nav>
  <span id="st">불러오는 중…</span>
  <button class="hl" id="admbtn" type="button">관리자</button>
  <a class="hl" href="/event/">행사 기록</a>
  <a class="hl" href="/ad/">쿠팡 광고 장부</a>
  <a class="hl" href="/naver/">네이버 광고 장부</a>
</header>
<div class="bar" id="mbar">
  <button class="b" id="pv" aria-label="이전 달">◀</button>
  <select id="mp" aria-label="기준 월"></select>
  <button class="b" id="nx" aria-label="다음 달">▶</button>
  <span class="sp"></span>
  <span class="note" id="src"></span>
</div>
<main>
  <section id="t-dash"></section>
  <section id="t-sale" hidden></section>
  <section id="t-mon" hidden></section>
  <section id="t-stock" hidden></section>
  <section id="t-inv" hidden></section>
  <section id="t-cost" hidden></section>
  <section id="t-up" hidden></section>
</main>
<div id="dlg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<script src="/erp/ecp.js?v=__V__"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY=iso(new Date());
const W=n=>n==null||!isFinite(n)?'–':Math.round(n).toLocaleString('ko-KR');
const P=x=>x==null||!isFinite(x)?'–':(x*100).toFixed(1)+'%';
const p2=n=>String(n).padStart(2,'0');
const mEnd=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const addD=(d,k)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+k);return iso(x)};
const dDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const API='/api/store?ns=erp';
const KEY=()=>{try{return localStorage.getItem('cpad_key')||''}catch(e){return''}};



/* ===== 상태 ===== */
const D={keys:[],cfg:{},s:{},p:{},t:{}},UI={tab:'dash',m:null,sale:null,stockD:null,stWh:'',stQ:'',invWh:null,invF:'',costF:'',monV:'a',q:''};
const ADM={pw:null};try{ADM.pw=sessionStorage.getItem('cpad_admpw')}catch(e){}
const st=t=>$('#st').textContent=t;
async function api(q,opt){const r=await fetch(API+q,{cache:'no-store',...opt,headers:{'content-type':'application/json','x-team-key':KEY(),'x-admin-key':encodeURIComponent(ADM.pw||''),...(opt&&opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.msg||j.error||r.status),{j,status:r.status});return j}
async function load(){st('불러오는 중…');
  try{const{keys}=await api('');D.keys=keys;const T=keys.filter(k=>k[0]=='t').sort(),want=keys.filter(k=>k=='cfg'||k[0]=='s'||k[0]=='p').concat(T.slice(-2));
    const docs=want.length?(await api('&k='+want.join(','))).docs:{};D.s={};D.p={};D.t={};D.cfg={};
    for(const[k,v]of Object.entries(docs)){if(!v)continue;if(k=='cfg')D.cfg=v;else D[k[0]][k.slice(1)]=v}
    st('저장소 연결됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}))}
  catch(e){st('저장소에 연결하지 못했습니다');}
  ROWS.clear();fixMonth();render()}
async function loadT(d){if(D.t[d]||!D.keys.includes('t'+d))return;const j=await api('&k=t'+d);if(j.docs['t'+d])D.t[d]=j.docs['t'+d]}
async function put(docs){await api('',{method:'PUT',body:JSON.stringify({docs})});
  for(const[k,v]of Object.entries(docs)){const c=k[0];if(v===null){D.keys=D.keys.filter(x=>x!=k);if(k=='cfg')D.cfg={};else delete D[c][k.slice(1)]}else{if(!D.keys.includes(k))D.keys.push(k);if(k=='cfg')D.cfg=v;else D[c][k.slice(1)]=v}}
  D.keys.sort();ROWS.clear()}

/* ===== 자료 꺼내기 ===== */
const months=()=>[...new Set([...Object.keys(D.s),...Object.keys(D.p)])].sort();
const stockDates=()=>D.keys.filter(k=>k[0]=='t').map(k=>k.slice(1)).sort();
const ROWS=new Map();
function rowsOf(m){if(ROWS.has(m))return ROWS.get(m);const S=D.s[m];if(!S)return[];
  const o=S.L.filter(l=>l[3]||l[4]||l[6]).map(l=>{const q=l[4],a=l[6],ca=l[8];return{d:`${m}-${p2(l[0])}`,no:l[1],c:S.C[l[2]]||'',code:l[3],nm:S.I[l[3]]||'',q,pr:l[5],a,uc:l[7],ca,pf:a-ca,mg:a?(a-ca)/a:null}});ROWS.set(m,o);return o}
/* 거래처별로 묶을 때: 거래처를 모르는 날(품목별 파일만 있는 날)은 그날 거래처 합계(CD)로 대신 */
const NOC='(거래처 미확인)';
function custRows(R,f,t){const days=new Set();for(const m of Object.keys(D.s)){const CD=D.s[m].CD;if(!CD)continue;for(const d of Object.keys(CD)){const ds=`${m}-${p2(d)}`;if((!f||ds>=f)&&(!t||ds<=t))days.add(ds)}}
  if(!days.size)return R;const out=R.filter(r=>!(days.has(r.d)&&r.c==NOC));
  for(const ds of days){const CD=D.s[ds.slice(0,7)].CD[+ds.slice(8)];CD.forEach(([c,q,a,ca])=>out.push({d:ds,no:null,c,code:'',nm:'(품목 미확인)',q,pr:q?a/q:0,a,uc:q?ca/q:0,ca,pf:a-ca,mg:a?(a-ca)/a:null}))}return out}
function rowsIn(f,t){const out=[];for(const m of Object.keys(D.s).sort()){if(m<f.slice(0,7)||m>t.slice(0,7))continue;for(const r of rowsOf(m))if(r.d>=f&&r.d<=t)out.push(r)}return out}
const lastSaleDay=()=>{let z=null;for(const m of Object.keys(D.s)){const S=D.s[m];S.R.forEach(r=>{const d=`${m}-${p2(r[1])}`;if(!z||d>z)z=d})}return z};
const firstSaleDay=()=>{let z=null;for(const m of Object.keys(D.s)){const S=D.s[m];S.R.forEach(r=>{const d=`${m}-${p2(r[0])}`;if(!z||d<z)z=d})}return z};
const rangeTxt=m=>{const S=D.s[m];if(S)return S.R.map(r=>`${+m.slice(5)}/${r[0]}~${+m.slice(5)}/${r[1]}`).join(', ');const Pd=D.p[m];return Pd?`${Pd.from.slice(5).replace('-','/')}~${Pd.to.slice(5).replace('-','/')} (품목별 합계)`:''};
const names=()=>{const o={};Object.values(D.s).forEach(S=>Object.assign(o,S.I));Object.values(D.p).forEach(Pd=>Pd.R.forEach(r=>{if(!o[r[0]])o[r[0]]=r[1]}));Object.values(D.t).forEach(T=>Object.values(T.W).forEach(rs=>rs.forEach(r=>{if(!o[r[0]])o[r[0]]=r[1]})));return o};
function sumRows(R){const o={q:0,a:0,ca:0,pf:0,sup:0,ra:0,rq:0,n:R.length};for(const r of R){o.q+=r.q;o.a+=r.a;o.ca+=r.ca;o.pf+=r.pf;o.sup+=r.pr*r.q;if(r.q<0||r.a<0){o.ra+=r.a;o.rq+=r.q}}o.mg=o.a?o.pf/o.a:null;return o}
function monthSum(m){if(D.s[m])return sumRows(rowsOf(m));const Pd=D.p[m];if(!Pd)return null;const o={q:0,a:0,ca:0,pf:0,ra:null,rq:null,n:null};Pd.R.forEach(r=>{o.q+=r[2];o.a+=r[3];o.ca+=r[4]});o.pf=o.a-o.ca;o.mg=o.a?o.pf/o.a:null;return o}
function group(R,keyf,lab){const M=new Map();for(const r of R){const k=keyf(r);let g=M.get(k);if(!g){g={k,...lab(r),q:0,a:0,ca:0,pf:0,sup:0,n:0,rq:0,ra:0};M.set(k,g)}g.q+=r.q;g.a+=r.a;g.ca+=r.ca;g.pf+=r.pf;g.sup+=r.pr*r.q;g.n++;if(r.q<0||r.a<0){g.rq+=r.q;g.ra+=r.a}}
  return[...M.values()].map(g=>({...g,mg:g.a?g.pf/g.a:null,ap:g.q?g.sup/g.q:null,uc:g.q?g.ca/g.q:null}))}
function stockAt(d){const T=D.t[d];if(!T)return null;const wh=Object.keys(T.W),it=new Map();
  wh.forEach(w=>T.W[w].forEach(r=>{let o=it.get(r[0]);if(!o){o={code:r[0],nm:r[1],w:{},q:0,a:0};it.set(r[0],o)}o.w[w]=(o.w[w]||0)+r[2];o.q+=r[2];o.a+=r[4]}));
  return{d,wh,items:[...it.values()]}}

/* ===== 표 (화면은 일부, 엑셀은 전체) ===== */
const TB={};
function tbl(id,title,note,cols,rows,total,o={}){TB[id]={title,note,cols,rows,total};const lim=o.limit||400,show=rows.slice(0,lim);
  const cell=(c,r,isT)=>{if(isT&&c.noT)return'<td></td>';let v=typeof c.k=='function'?c.k(r,isT):r[c.k];const neg=(c.t=='w'||c.t=='p'||c.t=='n')&&typeof v=='number'&&v<0;
    const s=c.f?c.f(v,r,isT):c.t=='w'||c.t=='n'?W(v):c.t=='p'?P(v):esc(v??'');return`<td class="${c.t&&c.t!='s'?'n':''}${c.cls?' '+c.cls:''}${neg?' neg':''}"${c.t=='s'&&v&&String(v).length>24?` title="${esc(v)}"`:''}>${isT&&!c.f&&!c.t?`<b>${s}</b>`:s}</td>`};
  return`<div class="box" data-tb="${id}"><h3>${esc(title)}${note?` <small>${esc(note)}</small>`:''}<span class="sp" style="flex:1"></span>${o.tools||''}<button class="b s" data-x="${id}" type="button">엑셀 다운로드</button></h3>
  <div class="tw scroll"><table><thead><tr>${cols.map(c=>`<th class="${c.t&&c.t!='s'?'n':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>
  ${show.map(r=>`<tr${o.rc?` class="${o.rc(r)}"`:''}>${cols.map(c=>cell(c,r)).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="note">${o.empty||'자료가 없습니다.'}</td></tr>`}
  ${total&&rows.length?`<tr class="gt">${cols.map(c=>cell(c,total,true)).join('')}</tr>`:''}</tbody></table></div>
  ${rows.length>lim?`<div class="more">화면에는 ${lim.toLocaleString()}줄까지만 보입니다 (전체 ${rows.length.toLocaleString()}줄). 전체는 엑셀 다운로드로 보세요.</div>`:''}</div>`}
function tbX(id){const t=TB[id];if(!t)return null;const R=[t.cols.map(c=>({v:c.h,h:true}))],RC=[''];
  const val=(c,r,isT)=>{if(isT&&c.noT)return{v:''};let v=typeof c.k=='function'?c.k(r,isT):r[c.k];if(c.x)v=c.x(v,r);
    if(c.t=='p')return{v:v==null||!isFinite(v)?'':v,z:'0.0%',neg:v<0};if(c.t=='w'||c.t=='n')return{v:v==null||v===''||!isFinite(v)?'':c.z?v:Math.round(v),z:c.z||'#,##0',neg:v<0};return{v:v==null?'':String(v)}};
  t.rows.forEach(r=>{R.push(t.cols.map(c=>val(c,r)));RC.push('')});if(t.total){R.push(t.cols.map(c=>({...val(c,t.total,true),b:true})));RC.push('gt')}
  return{title:t.title,note:t.note||'',R,M:[],RC,W:t.cols.length}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const d=tbX(b.dataset.x);if(d)xWrite([d],d.title,b)});

/*@@XEXPORT@@*/

/* ===== 공통 열 ===== */
const C={q:{h:'수량',k:'q',t:'n'},a:{h:'판매금액(공급가)',k:'a',t:'w'},ca:{h:'원가금액',k:'ca',t:'w'},pf:{h:'이익금액',k:'pf',t:'w'},mg:{h:'이익율',k:'mg',t:'p'},
  ap:{h:'평균 판매단가',k:'ap',t:'w',noT:1},uc:{h:'평균 원가단가',k:'uc',t:'w',noT:1}};
const tot=(R,extra)=>{const o=sumRows(R.map(r=>({q:r.q,a:r.a,ca:r.ca,pf:r.pf,pr:r.q?(r.sup??r.pr*r.q)/r.q:0})));return{...o,...extra}};
const totG=(G,extra)=>{const o={q:0,a:0,ca:0,pf:0,n:0};G.forEach(g=>{o.q+=g.q;o.a+=g.a;o.ca+=g.ca;o.pf+=g.pf;o.n+=g.n||0});o.mg=o.a?o.pf/o.a:null;return{...o,...extra}};

/* ===== 대시보드 ===== */
function svgDaily(R,m){const n=mEnd(m),A=Array(n).fill(0),Pf=Array(n).fill(0);R.forEach(r=>{const i=+r.d.slice(8)-1;A[i]+=r.a;Pf[i]+=r.pf});
  const mx=Math.max(1,...A),w=1200,h=230,pl=56,pb=24,bw=(w-pl-8)/n,y=v=>h-pb-(Math.max(0,v)/mx)*(h-pb-12);
  const tick=[0,.5,1].map(f=>mx*f);
  return`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="일별 판매금액과 이익"><g font-size="11" fill="var(--mute)">${tick.map(v=>`<line x1="${pl}" x2="${w-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v>=1e6?(v/1e6).toFixed(0)+'백만':W(v)}</text>`).join('')}
  ${A.map((v,i)=>`<rect x="${pl+i*bw+1}" y="${y(v)}" width="${Math.max(1,bw-2)}" height="${h-pb-y(v)}" fill="var(--sky)"><title>${+m.slice(5)}/${i+1} 판매 ${W(v)}원 · 이익 ${W(Pf[i])}원</title></rect><rect x="${pl+i*bw+1}" y="${y(Pf[i])}" width="${Math.max(1,bw-2)}" height="${h-pb-y(Pf[i])}" fill="var(--blue)" pointer-events="none"/>${(i+1)%5==1||i==n-1?`<text x="${pl+i*bw+bw/2}" y="${h-8}" text-anchor="middle">${i+1}</text>`:''}`).join('')}</g></svg>`}
function rDash(){const m=UI.m,sec=$('#t-dash');if(!m&&!stockDates().length){sec.innerHTML=emptyMsg();return}
  const R=m?rowsOf(m):[],S=m?monthSum(m):null,pm=prevM(m),PS=pm?monthSum(pm):null,sd=stockDates().slice(-1)[0],SK=sd?stockAt(sd):null,inv=SK?invRows(SK):[];
  const dv=(a,b)=>b&&b.a?`<i class="${a>=b?'up':'dn'}">전월 ${a>=b?'+':''}${P(a/b-1)}</i>`:'';
  const cnt=s=>inv.filter(x=>x.s==s),amt=L=>L.reduce((s,x)=>s+x.a,0);
  const neg=R.length?group(R,r=>r.code,r=>({nm:r.nm})).filter(g=>g.pf<0):[];
  const AL=[];
  if(cnt('품절').length)AL.push(`<b class="dn">품절 ${cnt('품절').length}품목</b> — 최근에 팔렸는데 재고가 0입니다.`);
  if(cnt('부족').length)AL.push(`<b class="dn">재고 부족 ${cnt('부족').length}품목</b> — ${D.cfg.short||14}일 안에 바닥나거나 안전재고 아래입니다.`);
  if(neg.length)AL.push(`<b class="dn">역마진 ${neg.length}품목</b> — 이 달 판매에서 이익이 마이너스입니다 (원가 관리 탭).`);
  if(cnt('무판매').length)AL.push(`<b>무판매 재고 ${W(amt(cnt('무판매')))}원</b> — 최근 ${D.cfg.win||30}일 판매가 없는 ${cnt('무판매').length}품목.`);

  if(ld)for(const m of Object.keys(D.s))for(const r of rowsOf(m))if(r.q>0&&(!last.has(r.code)||r.d>last.get(r.code)))last.set(r.code,r.d);
  const nm=names(),codes=new Set([...SK.items.map(x=>x.code),...sold.keys()]),im=new Map(SK.items.map(x=>[x.code,x]));
  const out=[];for(const code of codes){const x=im.get(code),ws=whSel||SK.wh;const q=x?ws.reduce((s,w)=>s+(x.w[w]||0),0):0,a=x&&x.q?x.a*q/x.q:0,sq=Math.max(0,sold.get(code)||0),avg=days?sq/days:0,dc=avg>0?q/avg:null,sf=safe[code]||0;

  const ord={품절:0,부족:1,과다:2,무판매:3,적정:4};return out.sort((a,b)=>ord[a.s]-ord[b.s]||b.a-a.a)}

    <label class="drop" id="drop"><input type="file" id="fi" multiple accept=".xlsx,.xls,.csv" hidden>${UP.busy?'읽는 중…':'여기로 파일을 끌어 놓거나 눌러서 고르세요'}</label>
    <div class="upguide" style="margin-top:12px"><b>이카운트에서 뽑는 방법</b>
      <table><tr><th>자료 (엑셀 맨 위 제목)</th><th>뽑을 때</th><th>들어가는 곳</th></tr>
      <tr><td>일별이익현황</td><td>이익현황을 <b>일별</b>로, 기간 지정 후 엑셀</td><td>매출 검색·월별 매출·원가 관리·재고 관리(판매량)</td></tr>
      <tr><td>품목별이익현황</td><td>이익현황을 <b>품목별</b>로, 한 달 기간</td><td>일별 자료가 없는 달의 월 합계</td></tr>
      <tr><td>일별재고현황 (창고별)</td><td>창고마다 한 시트씩, 한 파일이든 여러 파일이든</td><td>재고 현황·재고 관리</td></tr></table>
      <ul><li>엑셀 맨 위 <code>회사명 : 디앤디컴(주) / … / 2026/11/01 ~ 2026/11/26</code> 줄의 <b>기간·기준일</b>을 읽습니다. 지우지 말고 그대로 올리세요.</li>
      <li>재고현황은 그 줄의 <b>창고 이름</b>(예: 온비즈 용산창고)으로 창고를 나눕니다. 같은 기준일에 창고를 따로 올려도 합쳐집니다.</li>
      <li>매출은 올린 <b>기간만</b> 바뀌고 같은 달 다른 날은 그대로 남습니다. 주간으로 이어 올려도 됩니다.</li></ul></div>
    ${UP.log.length?`<div class="msg${UP.ok===false||UP.log.some(x=>x[0]=="✗")?" err":""}" style="margin-top:12px;display:block"><b>방금 올린 결과</b><ul id="log" style="margin:4px 0 0;padding-left:18px">${UP.log.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div></div>${have}`;
  const dr=$('#drop'),fi=$('#fi');fi.onchange=()=>upFiles([...fi.files]);
  dr.ondragover=e=>{e.preventDefault();dr.classList.add('on')};dr.ondragleave=()=>dr.classList.remove('on');dr.ondrop=e=>{e.preventDefault();dr.classList.remove('on');upFiles([...e.dataTransfer.files])};
  sec.querySelectorAll('[data-del]').forEach(a=>a.onclick=async e=>{e.preventDefault();const k=a.dataset.del;if(!a.dataset.a){a.dataset.a=1;a.textContent='한 번 더 누르면 삭제';return}
    try{await put({[k]:null});UP.log=[`${k.slice(1)} ${k[0]=='t'?'재고':'매출'} 자료를 지웠습니다.`];fixMonth();render()}catch(x){alertMsg(x)}})}
const alertMsg=x=>{UP.log=[x.status==403?'관리자 비밀번호가 맞지 않아 저장하지 못했습니다. 관리자 버튼으로 다시 여세요.':'저장하지 못했습니다: '+x.message];rUp()};
async function upFiles(files){if(!files.length||UP.busy)return;UP.busy=true;rUp();
  try{const r=await ECP.ingest(files,{pw:ADM.pw,key:KEY()});UP.log=r.log.length?r.log:['반영할 내용이 없었습니다.'];UP.ok=r.n>0;
    if(r.n){await load();const sm=Object.keys(r.out).filter(k=>k[0]=='s').sort();if(sm.length){UI.m=sm[sm.length-1].slice(1);const ld=lastSaleDay();UI.sale={f:ld.slice(0,8)+'01',t:ld,c:'',q:'',mode:'line',ret:''}}const tk=Object.keys(r.out).filter(k=>k[0]=='t').sort();if(tk.length)UI.stockD=tk[tk.length-1].slice(1)}}
  catch(x){UP.ok=false;UP.log=[x.status==403?'관리자 비밀번호가 맞지 않아 저장하지 못했습니다. 관리자 버튼으로 다시 여세요.':'읽거나 저장하지 못했습니다: '+x.message]}
  UP.busy=false;fixMonth();render()}

/* ===== 관리자 ===== */
function dlg(html){$('#dlg').innerHTML=`<div class="admdlg" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;$('#dlg [data-close]')&&($('#dlg [data-close]').onclick=closeDlg);const i=$('#dlg input');i&&i.focus()}
const closeDlg=()=>$('#dlg').innerHTML='';
function admDlg(){if(ADM.pw){ADM.pw=null;try{sessionStorage.removeItem('cpad_admpw')}catch(e){}render();return}
  dlg(`<h3>관리자</h3><div class="pad" style="display:grid;gap:10px"><label class="note">관리자 비밀번호 (광고 장부와 같음)<input class="t" type="password" id="apw" autocomplete="current-password"></label><div class="note dn" id="amsg"></div>
  <div style="display:flex;gap:8px"><button class="b p" id="ago" type="button">열기</button><button class="b" data-close type="button">닫기</button></div></div>`);
  const go=async()=>{const pw=$('#apw').value;if(!pw)return;try{const r=await fetch('/api/store?admin=check',{method:'POST',headers:{'content-type':'application/json','x-team-key':KEY()},body:JSON.stringify({pw})}).then(r=>r.json());
    if(r&&r.ok){ADM.pw=pw;try{sessionStorage.setItem('cpad_admpw',pw)}catch(e){}closeDlg();render()}else{const s=await fetch('/api/store?admin=status').then(r=>r.json()).catch(()=>({}));$('#amsg').textContent=s.set?'비밀번호가 맞지 않습니다.':'관리자 비밀번호가 아직 없습니다. 쿠팡 광고 장부 › 설정 탭에서 먼저 만드세요.'}}catch(e){$('#amsg').textContent='확인하지 못했습니다.'}};
  $('#ago').onclick=go;$('#apw').onkeydown=e=>{if(e.key=='Enter')go()};
  $('#dlg .admdlg').onclick=e=>{if(e.target.classList.contains('admdlg'))closeDlg()}}
$('#admbtn').onclick=admDlg;
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeDlg()});

/* ===== 화면 ===== */
function fixMonth(){const ms=months();if(!UI.m||!ms.includes(UI.m))UI.m=ms[ms.length-1]||null}
function render(){const ms=months(),b=$('#admbtn');b.classList.toggle('on',!!ADM.pw);b.textContent=ADM.pw?'관리자 모드 · 잠그기':'관리자';
  $('#mp').innerHTML=ms.map(m=>`<option value="${m}"${m==UI.m?' selected':''}>${m.slice(0,4)}년 ${+m.slice(5)}월</option>`).join('')||'<option>자료 없음</option>';
  $('#mbar').hidden=!['dash','cost'].includes(UI.tab);$('#src').textContent=UI.m?'매출 자료 '+rangeTxt(UI.m):'';
  $$('#nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t==UI.tab));$$('main>section').forEach(s=>s.hidden=s.id!='t-'+UI.tab);
  ({dash:rDash,sale:rSale,mon:rMon,stock:rStock,inv:rInv,cost:rCost,up:rUp})[UI.tab]()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;UI.tab=b.dataset.t;try{history.replaceState(null,'','#'+UI.tab)}catch(x){}render();scrollTo(0,0)};
$('#mp').onchange=e=>{UI.m=e.target.value;render()};
$('#pv').onclick=()=>{const ms=months(),i=ms.indexOf(UI.m);if(i>0){UI.m=ms[i-1];render()}};$('#nx').onclick=()=>{const ms=months(),i=ms.indexOf(UI.m);if(i<ms.length-1){UI.m=ms[i+1];render()}};
{const h=location.hash.slice(1);if(['dash','sale','mon','stock','inv','cost','up'].includes(h))UI.tab=h}
load();
addEventListener('focus',()=>{if(!UP.busy&&Date.now()-(window._lf||0)>60e3){window._lf=Date.now();load()}});
</script>
</body>
</html>
