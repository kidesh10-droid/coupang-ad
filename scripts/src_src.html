<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디앤디컴 소싱 · 알리바바 추천 상품</title>
<meta name="description" content="알리바바 소싱 추천 상품 · 공장가로 계산한 판매 가능 여부">
<meta property="og:type" content="website">
<meta property="og:title" content="디앤디컴 소싱 · 알리바바 추천 상품">
<meta property="og:description" content="알리바바 소싱 추천 상품 · 공장가로 계산한 판매 가능 여부">
<meta property="og:image" content="https://dnd-coupang.pages.dev/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b4541a'/%3E%3Ctext x='16' y='22' font-size='14' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3ESRC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/
:root{--bar:#8a3f12}
header a.hl,header button.hl{color:#fff;text-decoration:none;font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.45);padding:5px 10px;border-radius:3px;white-space:nowrap;background:none;cursor:pointer}
header a.hl:hover,header button.hl:hover{background:rgba(255,255,255,.12)}header button.hl.on{background:#f2c94c;color:#1b2330;border-color:#f2c94c;font-weight:600}
header button.go{background:#f2c94c;color:#1b2330;border-color:#f2c94c;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:0 12px;min-height:36px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--bar);color:#fff}
.f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;padding:12px}
.f label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.f input.s{width:92px}
.tw{overflow:auto}
td.ph{width:96px;padding:4px}td.ph img{width:88px;height:88px;object-fit:contain;display:block;background:#fff;cursor:zoom-in;border:1px solid var(--line)}
td.w2{white-space:normal;min-width:200px;max-width:300px;line-height:1.35;padding-block:6px}
td.w2 small{display:block;color:var(--mute);font-size:12px}
.ok{background:var(--blue);color:#fff}.no{background:var(--red);color:#fff}.chip{font-size:12px;padding:1px 6px;border-radius:2px;white-space:nowrap}
.cath{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cath input{width:110px;min-height:30px;font-size:14px}
.band{font-size:18px;margin:22px 0 10px;padding-left:10px;border-left:5px solid var(--bar)}
.view{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:grid;place-items:center;cursor:zoom-out}.view img{max-width:92vw;max-height:90vh;background:#fff}
.dlgw{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:start center;z-index:100;overflow:auto;padding:5vh 10px}
.dlgw>.box{width:min(860px,100%);margin:0;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}.frm label{display:grid;gap:3px;font-size:13px;color:var(--mute)}.frm .w{grid-column:1/-1}
.frm textarea{min-height:80px}
#alog{max-height:260px;overflow:auto;font-size:13px;background:var(--sub);border:1px solid var(--line);padding:8px 10px;margin-top:10px;white-space:pre-wrap}
.msg.err{border-left-color:var(--red);background:light-dark(#fff5f5,#2a1616)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;cursor:zoom-in}
.card .b2{padding:8px 10px;display:grid;gap:3px;font-size:13px}.card .b2 b{font-size:14px;line-height:1.35}
.card .pr{display:flex;justify-content:space-between;gap:6px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>소싱</h1>
  <span class="note" style="color:#f5dcc8" id="bt"></span>
  <span style="flex:1"></span>
  <span id="st">불러오는 중…</span>
  <button class="hl go" id="aibtn" type="button">🔎 AI 소싱 시작</button>
  <button class="hl" id="upbtn" type="button">⬆ 소싱 엑셀 올리기</button>
  <button class="hl" id="admbtn" type="button">관리자</button>
  <a class="hl" href="/ad/">쿠팡 광고 장부</a>
  <a class="hl" href="/erp/">ERP</a>
  <a class="hl" href="/event/">행사 기록</a>
</header>
<main id="main"></main>
<div id="dlg"></div>
<input type="file" id="fi" accept=".xlsx" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" async></script>
<script src="/sourcing/src_parse.js?v=__V__"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,TODAY=iso(new Date());
const W=n=>n==null||!isFinite(n)?'–':Math.round(n).toLocaleString('ko-KR');
const P=x=>x==null||!isFinite(x)?'–':(x*100).toFixed(1)+'%';
const KEY=()=>{try{return localStorage.getItem('cpad_key')||''}catch(e){return''}};
const API='/api/store?ns=src';
const ADM={pw:null};try{ADM.pw=sessionStorage.getItem('cpad_admpw')}catch(e){}
const st=t=>$('#st').textContent=t;
const hdr=()=>({'content-type':'application/json','x-team-key':KEY(),'x-admin-key':encodeURIComponent(ADM.pw||'')});
async function api(q,opt){const r=await fetch(API+q,{cache:'no-store',...opt,headers:hdr()});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.msg||j.error||r.status),{status:r.status});return j}
let B=[],AI=false;const UI={bid:null,band:'',cat:'',q:'',vd:'',view:'tbl'};
let LC={};try{LC=JSON.parse(localStorage.getItem('src_cfg')||'{}')}catch(e){}
async function load(){st('불러오는 중…');try{const j=await api('');B=j.batches||[];AI=j.ai;st('저장소 연결됨')}catch(e){st('저장소에 연결하지 못했습니다')}if(!UI.bid||!B.find(b=>b.id==UI.bid))UI.bid=(B[B.length-1]||{}).id;render()}
const cur=()=>B.find(b=>b.id==UI.bid);
const cfgOf=b=>({fee:.108,ad:.34,ship:4150,margin:.1,extra:.3,...(b&&b.cfg||{}),...(LC[UI.bid]||{})});
const planOf=(b,it)=>{const o=(LC[UI.bid]||{}).plans||{};return o[it.cat]!=null?o[it.cat]:it.plan};
const cu=it=>it.cu||('https://www.coupang.com/np/search?q='+encodeURIComponent(it.cq||it.cat));
function calc(b,it){const c=cfgOf(b),need=SRCP.need(it.pmin,c),plan=planOf(b,it);const m=plan&&it.pmin!=null?(plan*(1-c.fee-c.ad)-it.pmin*(1+c.extra)-c.ship)/plan:null;return{need,plan,m,ok:need!=null&&plan!=null?plan>=need:null}}

function render(){const b=$('#admbtn');b.classList.toggle('on',!!ADM.pw);b.textContent=ADM.pw?'관리자 모드 · 잠그기':'관리자';
  const m=$('#main'),bt=cur();if(!bt){m.innerHTML=`<div class="msg">소싱 자료가 없습니다. ${ADM.pw?'위의 AI 소싱 시작이나 소싱 엑셀 올리기로 넣으세요.':'관리자에게 요청하세요.'}</div>`;return}
  const c=cfgOf(bt),bands=[...new Set(bt.items.map(x=>x.band))],cats=[...new Set(bt.items.filter(x=>!UI.band||x.band==UI.band).map(x=>x.cat))];
  let L=bt.items.map((it,i)=>({...it,i,...calc(bt,it)}));
  if(UI.band)L=L.filter(x=>x.band==UI.band);if(UI.cat)L=L.filter(x=>x.cat==UI.cat);if(UI.vd)L=L.filter(x=>UI.vd=='ok'?x.ok:!x.ok);
  if(UI.q){const q=UI.q.toLowerCase();L=L.filter(x=>[x.name,x.cat,x.design,x.sup].join(' ').toLowerCase().includes(q))}
  const all=bt.items.map(it=>calc(bt,it)),okN=all.filter(x=>x.ok).length;
  $('#bt').textContent=`${new Date(bt.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} 업데이트`;
  const groups=[];L.forEach(x=>{let g=groups.find(g=>g.cat==x.cat);if(!g){g={cat:x.cat,band:x.band,items:[]};groups.push(g)}g.items.push(x)});
  m.innerHTML=`<h2>${esc(bt.file||bt.title)}</h2><p class="sub">${esc(bt.by=='ai'?'AI 소싱 (웹 검색) 결과':'엑셀로 올린 소싱 자료')} · ${new Date(bt.at).toLocaleString('ko-KR')} · ${esc(bt.note||'')}</p>
  <div class="kpi"><div><span>품목</span><b>${new Set(bt.items.map(x=>x.cat)).size}개</b></div><div><span>상품</span><b>${bt.items.length}개</b></div><div class="hl"><span>판매 가능 (진행)</span><b>${okN}개</b></div><div><span>보류</span><b>${bt.items.length-okN}개</b></div><div><span>가격대</span><b>${bands.length}개</b></div></div>
  <div class="box"><div class="f">
    <label>소싱 자료<select id="sb">${B.slice().reverse().map(x=>`<option value="${x.id}"${x.id==UI.bid?' selected':''}>${new Date(x.at).toLocaleDateString('ko-KR')} · ${esc((x.file||x.title||'').slice(0,40))} (${x.items.length})</option>`).join('')}</select></label>
    <span class="seg" role="group" aria-label="가격대"><button type="button" data-band="" aria-pressed="${!UI.band}">전체</button>${bands.map(x=>`<button type="button" data-band="${esc(x)}" aria-pressed="${UI.band==x}">${esc(x.split('(')[0].trim())}</button>`).join('')}</span>
    <label>품목<select id="sc"><option value="">전체</option>${cats.map(x=>`<option${x==UI.cat?' selected':''}>${esc(x)}</option>`).join('')}</select></label>
    <span class="seg" role="group" aria-label="판정"><button type="button" data-vd="" aria-pressed="${!UI.vd}">전체</button><button type="button" data-vd="ok" aria-pressed="${UI.vd=='ok'}">진행만</button><button type="button" data-vd="no" aria-pressed="${UI.vd=='no'}">보류만</button></span>
    <input class="t" id="sq" placeholder="검색 (상품·업체·디자인)" value="${esc(UI.q)}">
    <span class="seg" role="group" aria-label="보기"><button type="button" data-vw="tbl" aria-pressed="${UI.view=='tbl'}">표</button><button type="button" data-vw="card" aria-pressed="${UI.view=='card'}">사진 카드</button></span>
    ${ADM.pw?`<button class="b s r" id="bdel" type="button">이 소싱 자료 삭제</button>`:''}
  </div>
  <div class="f" style="padding-top:0"><span class="note">계산 기준 (바꾸면 판정이 다시 계산됨 · 이 기기에만 저장)</span>
    ${[['fee','수수료 %',100],['ad','광고비 %',100],['ship','배송비 원',1],['margin','마진 %',100],['extra','부대비(공장가의) %',100]].map(([k,l,mul])=>`<label>${l}<input class="t s" type="number" step="any" data-cf="${k}" data-mul="${mul}" value="${+(c[k]*mul).toFixed(2)}"></label>`).join('')}
    <button class="b s" id="cfr" type="button">기준 처음대로</button><span class="note">필요 최소 판매가 = (공장가 최저 × (1+부대비) + 배송비) ÷ (1 − 수수료 − 광고비 − 마진)</span></div></div>
  ${groups.map((g,gi)=>{const p=planOf(bt,g.items[0]),okc=g.items.filter(x=>x.ok).length;const band=gi==0||groups[gi-1].band!=g.band?`<h3 class="band">${esc(g.band)}</h3>`:'';
    return band+`<div class="box" data-tb="${gi}"><h3 class="cath">■ ${esc(g.cat)} <small>계획 판매가</small><input class="t" type="number" step="100" data-plan="${esc(g.cat)}" value="${p??''}" aria-label="계획 판매가"><small>원 · 진행 ${okc}/${g.items.length}</small><a class="b s" href="${esc(cu(g.items[0]))}" target="_blank" rel="noopener" style="text-decoration:none">쿠팡 시세 보기 ↗</a><span style="flex:1"></span><button class="b s" data-x="${gi}" type="button">엑셀 다운로드</button></h3>
    ${UI.view=='card'?`<div class="pad"><div class="cards">${g.items.map(x=>`<div class="card">${x.img?`<img src="${esc(x.img)}" alt="" data-big="${esc(x.img)}" loading="lazy">`:''}<div class="b2"><b>${esc(x.name)}</b><span class="note">${esc(x.design)}</span><span>${esc(x.sup)} ${x.ver?'✔':''} <span class="note">${esc(x.yr)}</span></span><span class="pr"><span>공장가 <b>${W(x.pmin)}</b>${x.pmax&&x.pmax!=x.pmin?'~'+W(x.pmax):''}원 · MOQ ${esc(x.moq)}</span></span><span class="pr"><span>최소 판매가 ${W(x.need)}원</span><span class="chip ${x.ok?'ok':'no'}">${x.ok?'진행':'보류'}</span></span>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">알리바바 상품 열기 ↗</a>`:''}</div></div>`).join('')}</div></div>`
    :`<div class="tw scroll"><table><thead><tr><th>사진</th><th>상품</th><th>업체</th><th>업력 · 평점</th><th>판매실적</th><th class="n">공장가 최저</th><th class="n">공장가 최고</th><th>MOQ</th><th class="n">필요 최소 판매가</th><th class="n">계획 판매가</th><th class="n">예상 마진율</th><th>판정</th><th>링크</th></tr></thead><tbody>
    ${g.items.map(x=>`<tr><td class="ph">${x.img?`<img src="${esc(x.img)}" alt="" data-big="${esc(x.img)}" loading="lazy">`:''}</td><td class="w2"><b>${esc(x.name)}</b><small>${esc(x.design)}</small></td><td class="w2">${esc(x.sup)}${x.ver?' <span class="chip ok">✔ Verified</span>':''}</td><td>${esc(x.yr)}</td><td>${esc(x.sold)}</td><td class="n">${W(x.pmin)}</td><td class="n">${W(x.pmax)}</td><td>${esc(x.moq)}</td><td class="n">${W(x.need)}</td><td class="n">${W(x.plan)}</td><td class="n${x.m<0?' neg':''}">${P(x.m)}</td><td><span class="chip ${x.ok?'ok':'no'}">${x.ok?'진행':'보류'}</span></td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">상품 열기 ↗</a>`:''}</td></tr>`).join('')}
    <tr class="gt"><td>합계</td><td>${g.items.length}개 상품</td><td></td><td></td><td></td><td class="n">${W(Math.min(...g.items.map(x=>x.pmin??Infinity)))}</td><td class="n">${W(Math.max(...g.items.map(x=>x.pmax??-Infinity)))}</td><td></td><td class="n">${W(Math.min(...g.items.map(x=>x.need??Infinity)))}</td><td class="n">${W(p)}</td><td class="n">${P(Math.max(...g.items.map(x=>x.m??-Infinity)))}</td><td>진행 ${okc}</td><td></td></tr></tbody></table></div>`}</div>`}).join('')||'<div class="msg">조건에 맞는 상품이 없습니다.</div>'}
  <p class="note">합계 줄: 공장가는 최저·최고, 필요 최소 판매가는 가장 낮은 값, 예상 마진율은 가장 높은 값입니다. 예상 마진율 = 계획 판매가에서 수수료·광고비·공장가(부대비 포함)·배송비를 빼고 남는 비율.</p>`;
  window._G=groups;
  $('#sb').onchange=e=>{UI.bid=e.target.value;UI.cat='';render()};
  $$('[data-band]').forEach(x=>x.onclick=()=>{UI.band=x.dataset.band;UI.cat='';render()});$$('[data-vd]').forEach(x=>x.onclick=()=>{UI.vd=x.dataset.vd;render()});$$('[data-vw]').forEach(x=>x.onclick=()=>{UI.view=x.dataset.vw;render()});
  $('#sc').onchange=e=>{UI.cat=e.target.value;render()};let tm;$('#sq').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{UI.q=e.target.value.trim();render();const i=$('#sq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
  const sv=()=>{try{localStorage.setItem('src_cfg',JSON.stringify(LC))}catch(e){}};
  $$('[data-cf]').forEach(i=>i.onchange=()=>{const o=LC[UI.bid]=LC[UI.bid]||{};o[i.dataset.cf]=(+i.value||0)/+i.dataset.mul;sv();render()});
  $$('[data-plan]').forEach(i=>i.onchange=()=>{const o=LC[UI.bid]=LC[UI.bid]||{};o.plans=o.plans||{};o.plans[i.dataset.plan]=+i.value||null;sv();render()});
  $('#cfr').onclick=()=>{delete LC[UI.bid];sv();render()};
  $$('[data-big]').forEach(i=>i.onclick=()=>{const v=document.createElement('div');v.className='view';v.innerHTML=`<img src="${esc(i.dataset.big)}" alt="">`;document.body.appendChild(v);v.onclick=()=>v.remove()});
  const bd=$('#bdel');if(bd)bd.onclick=async()=>{if(!bd.dataset.a){bd.dataset.a=1;bd.textContent='한 번 더 누르면 삭제';return}try{const j=await api('',{method:'PUT',body:JSON.stringify({op:'del',id:UI.bid})});B=j.batches;UI.bid=(B[B.length-1]||{}).id;render()}catch(x){st(x.message)}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const g=(window._G||[])[+b.dataset.x];if(!g)return;
  const H=['품목','상품','디자인 포인트','업체','Verified','업력 · 평점','판매실적','공장가 최저(원)','공장가 최고(원)','MOQ','필요 최소 판매가(원)','계획 판매가(원)','예상 마진율','판정','알리바바 링크'];
  const R=[H.map(v=>({v,h:true}))],RC=[''];g.items.forEach(x=>{R.push([x.cat,x.name,x.design,x.sup,x.ver?'O':'',x.yr,x.sold].map(v=>({v})).concat([x.pmin,x.pmax].map(v=>({v:v??'',z:'#,##0'})),[{v:x.moq}],[x.need,x.plan].map(v=>({v:v==null?'':Math.round(v),z:'#,##0'})),[{v:x.m??'',z:'0.0%',neg:x.m<0},{v:x.ok?'진행':'보류'},{v:x.url}]));RC.push('')});
  xWrite([{title:'소싱 '+g.cat,note:'',R,M:[],RC,W:H.length}],'소싱_'+g.cat,b)});

/*@@XEXPORT@@*/

/* ===== 엑셀 올리기 ===== */
$('#upbtn').onclick=()=>{if(!ADM.pw)return admDlg('소싱 엑셀 올리기는 관리자만 할 수 있습니다.');$('#fi').click()};
$('#fi').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;st('읽는 중…');
  for(let i=0;i<50&&!(window.XLSX&&window.JSZip);i++)await new Promise(r=>setTimeout(r,200));
  let n=0;for(const f of fs){try{const bs=await SRCP.file(f,XLSX,window.JSZip);for(const b of bs){b.id='f'+Date.now().toString(36)+n;b.at=Date.now();b.by='file';b.file=f.name.replace(/\.xlsx$/i,'');st(`올리는 중… ${b.items.length}개 상품`);const j=await api('',{method:'PUT',body:JSON.stringify({op:'add',batch:b})});B=j.batches;UI.bid=b.id;n++}
    if(!bs.length)st(`${f.name}: 소싱 양식(품목·상품 열)을 찾지 못했습니다`)}catch(x){st(`${f.name}: ${x.message}`)}}
  if(n){UI.band='';UI.cat='';render();st(`소싱 자료 ${n}개 올림`)}};

/* ===== AI 소싱 ===== */
function dlg(html){$('#dlg').innerHTML=`<div class="dlgw" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;$$('#dlg [data-close]').forEach(b=>b.onclick=closeDlg)}
const closeDlg=()=>{if(RUN)return;$('#dlg').innerHTML=''};let RUN=false;
$('#aibtn').onclick=()=>{if(!ADM.pw)return admDlg('AI 소싱은 관리자만 시작할 수 있습니다 (검색 비용이 듭니다).');
  const bt=cur(),c=cfgOf(bt),cats=bt?[...new Set(bt.items.map(x=>x.cat))]:[];
  dlg(`<h3>🔎 AI 소싱 — 알리바바에서 새 상품 찾기<span style="flex:1"></span><button class="b s" data-close type="button">닫기</button></h3><div class="pad">
  ${AI?'':'<div class="msg err">아직 연결되지 않았습니다: Cloudflare Pages 프로젝트 설정 → 환경변수에 <b>ANTHROPIC_API_KEY</b>(Claude API 키)를 넣어야 이 버튼이 동작합니다. 넣은 뒤 다시 배포되면 바로 쓸 수 있습니다.</div>'}
  <div class="frm">
   <label class="w">찾을 품목·키워드 (줄바꿈으로 여러 개, 비우면 소형가전 전체에서 새 아이템)<textarea id="aq" placeholder="예: 충전식 손난로&#10;미니 가습기&#10;겨울 소형가전 신상">${''}</textarea></label>
   <label>가격대<select id="ab"><option value="">전체 (3만원대·5~8만원대·10만원대)</option><option>3만원대</option><option>5~8만원대</option><option>10만원대</option></select></label>
   <label>상품 수 (대략)<input class="t" type="number" id="an" value="20" min="5" max="60"></label>
   <label>환율 (원/$)<input class="t" type="number" id="afx" value="1400"></label>
   <label>업체 업력 최소 (년)<input class="t" type="number" id="ay" value="5"></label>
   <label class="w"><span><input type="checkbox" id="ax" checked> 지금 자료에 있는 상품(${cats.length}개 품목)은 빼고 새로 찾기</span></label>
  </div>
  <p class="note">기준: 수수료 ${P(c.fee)} · 광고비 ${P(c.ad)} · 배송비 ${W(c.ship)}원 · 마진 ${P(c.margin)} · 부대비 공장가의 ${P(c.extra)} — 이 조건으로 남는 공장가만 고릅니다. 웹 검색이라 몇 분 걸리고, 공장가·실적은 검색 시점 값입니다. 사진은 상품 페이지에서 찾은 경우에만 들어갑니다.</p>
  <div style="display:flex;gap:8px"><button class="b p" id="ago" type="button"${AI?'':' disabled'}>지금 시작</button></div>
  <div id="alog" hidden></div></div>`);
  const go=$('#ago');if(go)go.onclick=()=>runAI({q:$('#aq').value.trim(),band:$('#ab').value,n:+$('#an').value||20,fx:+$('#afx').value||1400,yr:+$('#ay').value||5,ex:$('#ax').checked?cats:[]},c)};
async function runAI(o,c){const log=$('#alog');log.hidden=false;const L=t=>{log.textContent+=t+'\n';log.scrollTop=1e9};RUN=true;$('#ago').disabled=true;
  const system=`너는 한국 쿠팡 셀러(소형가전)의 소싱 담당이다. 알리바바(alibaba.com)에서 실제로 있는 상품만 찾고, 지어내지 않는다. 찾은 상품마다 알리바바 상품 페이지 URL이 있어야 한다.`;
  const prompt=`알리바바에서 쿠팡에 팔 소형가전 상품을 찾아 줘.
- 찾을 품목: ${o.q||'겨울·생활 소형가전 중 디자인 좋은 상품 (자유롭게)'}
- 가격대: ${o.band||'3만원대 · 5~8만원대 · 10만원대 판매가 모두'}
- 상품 수: 약 ${o.n}개 (품목마다 1~4개)
- 업체: 알리바바 업력 ${o.yr}년 이상, Verified 우선, 평점 높은 곳
- 디자인: 썸네일이 깔끔하고 선물·감성 디자인 우선
- 판매 기준: 계획 판매가에서 수수료 ${o.fee??(c.fee*100).toFixed(1)}% · 광고비 ${(c.ad*100).toFixed(1)}% · 마진 ${(c.margin*100).toFixed(0)}% · 배송비 ${c.ship}원을 빼고, 공장가×(1+${c.extra})가 남는 상품만. 공장가는 달러를 ${o.fx}원으로 바꿔 원으로.
${o.ex.length?`- 이미 있는 품목은 빼기: ${o.ex.join(', ')}`:''}
쿠팡 시세는 품목별 쿠팡 검색어로 감 잡아서 계획 판매가(원)를 정해 줘.
마지막에 결과를 아래 JSON 하나로만, \`\`\`json 블록으로 줘. 다른 설명은 JSON 밖에 짧게.
{"title":"한 줄 제목","items":[{"band":"① 3만원대 판매","cat":"품목명","plan":34900,"cq":"쿠팡 검색어","name":"상품 한국어 이름","design":"디자인 포인트","sup":"업체 영문명","ver":true,"yr":"6년 · 4.5 (56)","sold":"67개","pmin":740,"pmax":1576,"moq":"1개","url":"https://www.alibaba.com/product-detail/...","img":"상품 대표 이미지 URL(없으면 빈 문자열)"}]}`;
  let text='',buf='',n=0;
  try{L('시작합니다… (몇 분 걸릴 수 있습니다)');const r=await fetch(API+'&run=1',{method:'POST',headers:hdr(),body:JSON.stringify({system,prompt,searches:30,fetches:30})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||('오류 '+r.status))}
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;while((k=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,k);buf=buf.slice(k+2);const dl=ev.split('\n').find(x=>x.startsWith('data:'));if(!dl)continue;let d;try{d=JSON.parse(dl.slice(5))}catch(e){continue}
      if(d.type=='content_block_start'&&d.content_block&&d.content_block.type=='server_tool_use'){n++;L(`${n}. ${d.content_block.name=='web_search'?'검색':'페이지 열기'} 중…`)}
      if(d.type=='content_block_delta'&&d.delta){if(d.delta.type=='text_delta')text+=d.delta.text;if(d.delta.type=='input_json_delta'&&d.delta.partial_json){const m=d.delta.partial_json.match(/"(?:query|url)"\s*:\s*"([^"]+)/);if(m)L('   → '+m[1])}}
      if(d.type=='error')throw new Error((d.error&&d.error.message)||'API 오류')}}
    const m=text.match(/```json\s*([\s\S]*?)```/)||text.match(/(\{[\s\S]*"items"[\s\S]*\})/);if(!m)throw new Error('결과 JSON을 받지 못했습니다');
    const J=JSON.parse(m[1]);const items=(J.items||[]).filter(x=>x&&x.name&&x.url).map(x=>({band:x.band||'',cat:x.cat||'',plan:+x.plan||null,cq:x.cq||x.cat||'',cu:'',name:x.name,design:x.design||'',sup:x.sup||'',ver:!!x.ver,yr:x.yr||'',sold:x.sold||'',pmin:+x.pmin||null,pmax:+x.pmax||+x.pmin||null,moq:x.moq||'',url:x.url,img:/^https?:\/\//.test(x.img||'')?x.img:''}));
    if(!items.length)throw new Error('조건에 맞는 상품을 찾지 못했습니다');
    const b={id:'a'+Date.now().toString(36),at:Date.now(),by:'ai',file:'AI 소싱 · '+(J.title||o.q||'소형가전'),title:J.title||'',note:`검색 ${n}회 · 환율 ${o.fx}원`,cfg:{...c},items};
    const j=await api('',{method:'PUT',body:JSON.stringify({op:'add',batch:b})});B=j.batches;UI.bid=b.id;UI.band='';UI.cat='';L(`완료: ${items.length}개 상품 저장`);RUN=false;setTimeout(()=>{closeDlg();render()},800)}
  catch(x){RUN=false;L('✗ '+x.message);$('#ago').disabled=false}}

/* ===== 관리자 ===== */
function admDlg(why){if(ADM.pw&&!why){ADM.pw=null;try{sessionStorage.removeItem('cpad_admpw')}catch(e){}render();return}
  dlg(`<h3>관리자</h3><div class="pad" style="display:grid;gap:10px;max-width:420px">${why?`<p style="margin:0">${esc(why)}</p>`:''}<label class="note">관리자 비밀번호 (광고 장부와 같음)<input class="t" type="password" id="apw" autocomplete="current-password"></label><div class="note dn" id="amsg"></div>
  <div style="display:flex;gap:8px"><button class="b p" id="agw" type="button">열기</button><button class="b" data-close type="button">닫기</button></div></div>`);
  const go=async()=>{const pw=$('#apw').value;if(!pw)return;try{const r=await fetch('/api/store?admin=check',{method:'POST',headers:{'content-type':'application/json','x-team-key':KEY()},body:JSON.stringify({pw})}).then(r=>r.json());
    if(r&&r.ok){ADM.pw=pw;try{sessionStorage.setItem('cpad_admpw',pw)}catch(e){}closeDlg();render()}else $('#amsg').textContent='비밀번호가 맞지 않습니다.'}catch(e){$('#amsg').textContent='확인하지 못했습니다.'}};
  $('#agw').onclick=go;$('#apw').onkeydown=e=>{if(e.key=='Enter')go()};$('#apw').focus()}
$('#admbtn').onclick=()=>admDlg();document.addEventListener('keydown',e=>{if(e.key=='Escape'){const v=$('.view');if(v)v.remove();else closeDlg()}});
load();
</script>
</body>
</html>
