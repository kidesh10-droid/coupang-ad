async function runAI(o,c){const log=$('#alog');log.hidden=false;const L=t=>{log.textContent+=t+'\n';log.scrollTop=1e9};RUN=true;$('#ago').disabled=true;
  const system=`너는 한국 쿠팡 셀러(소형가전)의 소싱 담당이다. 알리바바(alibaba.com)에서 실제로 있는 상품만 찾고, 지어내지 않는다. 찾은 상품마다 알리바바 상품 페이지 URL이 있어야 한다.`;
  const prompt=`알리바바에서 쿠팡에 팔 소형가전 상품을 찾아 줘.
- 찾을 품목: ${o.q||'겨울·생활 소형가전 중 디자인 좋은 상품 (자유롭게)'}

${o.ex.length?`- 이미 있는 품목은 빼기: ${o.ex.join(', ')}`:''}
쿠팡 시세는 품목별 쿠팡 검색어로 감 잡아서 계획 판매가(원)를 정해 줘.
마지막에 결과를 아래 JSON 하나로만, \`\`\`json 블록으로 줘. 다른 설명은 JSON 밖에 짧게.
{"title":"한 줄 제목","items":[{"band":"① 3만원대 판매","cat":"품목명","plan":34900,"cq":"쿠팡 검색어","name":"상품 한국어 이름","design":"디자인 포인트","sup":"업체 영문명","ver":true,"yr":"6년 · 4.5 (56)","sold":"67개","pmin":740,"pmax":1576,"moq":"1개","url":"https://www.alibaba.com/product-detail/...","img":"상품 대표 이미지 URL(없으면 빈 문자열)"}]}`;
  let text='',buf='',n=0;
  try{L('시작합니다… (몇 분 걸릴 수 있습니다)');const r=await fetch(API+'&run=1',{method:'POST',headers:hdr(),body:JSON.stringify({system,prompt,searches:30,fetches:30})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||('오류 '+r.status))}
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;while((k=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,k);buf=buf.slice(k+2);const dl=ev.split('\n').find(x=>x.startsWith('data:'));if(!dl)continue;let d;try{d=JSON.parse(dl.slice(5))}catch(e){continue}
      if(d.type=='content_block_start'&&d.content_block&&d.content_block.type=='server_tool_use'){n++;L(`${n}. ${d.content_block.name=='web_search'?'검색':'페이지 열기'} 중…`)}
